[project]
name = "symbol-api-checks"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "aiohttp",
    "httpx",
    "requests",
    "urllib3",
]

[dependency-groups]
dev = [
    # 1.40 exits 245 before printing anything inside the Nix sandbox on
    # Linux (the `sdk-py` check), while 1.39 runs; lift once it starts.
    "basedpyright<1.40",
    "ruff>=0.16.4",
]

[tool.uv]
package = false

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
reportMissingTypeStubs = false
reportPrivateUsage = false

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "TRY004",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"static/api.py" = ["F821"]
