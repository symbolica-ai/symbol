[package]
name = "symbol"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
description = "Tiny static-site hosting for the tailnet"

[dependencies]
axum = "0.8"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
getrandom = "0.4"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "process", "signal", "sync"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
maud = "0.27.0"
tokio-util = { version = "0.7.19", features = ["io"] }
futures-util = "=0.3.32"
time = { version = "0.3.55", features = ["formatting"] }
subtle = "2.6.1"
symbol-contract = { path = "../symbol-contract" }
diesel = { version = "2.3.12", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
sea-query = { version = "1.0.2", features = ["backend-sqlite", "derive"], default-features = false }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
toml = "1.1.4"
saphyr = { version = "0.1.0", default-features = false }
saphyr-parser = { version = "0.1.0", default-features = false }

[dev-dependencies]
proptest = "1.11.0"
pulldown-cmark = "0.13.4"
swc_core = { version = "77.0.3", default-features = false, features = ["common", "ecma_ast", "ecma_codegen", "ecma_parser_typescript", "ecma_transforms_typescript", "ecma_transforms_module", "ecma_visit"] }
tempfile = "3"
toml = "1.1.4"
tower = { version = "0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allocation and ownership costs.
arc_with_non_send_sync = "warn"
assigning_clones = "warn"
borrowed_box = "warn"
box_collection = "warn"
clone_on_ref_ptr = "warn"
clone_on_copy = "warn"
implicit_clone = "warn"
iter_overeager_cloned = "warn"
large_enum_variant = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
needless_collect = "warn"
needless_pass_by_value = "warn"
owned_cow = "warn"
rc_buffer = "warn"
redundant_clone = "warn"
unnecessary_to_owned = "warn"
vec_box = "warn"

# Performance traps.
inefficient_to_string = "warn"
manual_memcpy = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
or_fun_call = "warn"

# Duplication and unnecessary complexity.
branches_sharing_code = "warn"
cognitive_complexity = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
missing_const_for_fn = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
too_many_lines = "warn"
trait_duplication_in_bounds = "warn"
type_repetition_in_bounds = "warn"
unnested_or_patterns = "warn"
use_self = "warn"

[build-dependencies]
blake3 = "1"
lightningcss = { version = "1.0.0-alpha.72", default-features = false }
maud = "0.27.0"
pulldown-cmark = "0.13.4"
sea-query = { version = "1.0.2", default-features = false, features = ["backend-sqlite", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swc_core = { version = "77.0.3", default-features = false, features = ["common", "ecma_ast", "ecma_codegen", "ecma_parser_typescript", "ecma_transforms_typescript", "ecma_transforms_module", "ecma_visit"] }
symbol-contract = { path = "../symbol-contract" }
thiserror = "2"
toml = "1.1.4"
