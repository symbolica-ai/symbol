too-many-lines-threshold = 100
cognitive-complexity-threshold = 20
too-many-arguments-threshold = 6
type-complexity-threshold = 200
pass-by-value-size-limit = 128
array-size-threshold = 131072
# Proper names that clippy's doc lint would otherwise demand be backticked.
# `..` keeps clippy's own defaults.
doc-valid-idents = ["CommonMark", "KaTeX", ".."]
